[project]
name = "mieter-app"
version = "0.1.0"
description = "Betriebskostenabrechnungen für Mieter erfassen, nachrechnen und auswerten"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.3.8",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ", "SIM"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mieter.settings"
testpaths = ["tests"]
addopts = "--strict-markers"
