# Entwicklungsumgebung: nur die Datenbank. Django läuft lokal mit uv.
#   docker compose -f compose.dev.yml up -d
name: mieter-app-dev

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mieter}
      POSTGRES_USER: ${POSTGRES_USER:-mieter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mieter-entwicklung}
      TZ: Europe/Berlin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-daten:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-daten:
