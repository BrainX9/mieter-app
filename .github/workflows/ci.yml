name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mieter
          POSTGRES_USER: mieter
          POSTGRES_PASSWORD: mieter-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mieter -d mieter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: nur-fuer-ci-nicht-geheim
      DATABASE_URL: postgres://mieter:mieter-ci@localhost:5432/mieter
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest

  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Gleiche Version wie in .pre-commit-config.yaml. Der pre-commit-Hook prüft nur
      # gestagte Änderungen, deshalb hier das offizielle Image über die gesamte Git-Historie.
      - name: gitleaks über die Git-Historie
        run: >-
          docker run --rm -u "$(id -u):$(id -g)" -v "${PWD}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.0
          git --redact --verbose /repo

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mieter-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker/smoke-test.sh mieter-app:test
      - run: docker/compose-test.sh mieter-app:test
