name: Image veröffentlichen

# Baut das Image für amd64 und arm64 und legt es unter ghcr.io/brainx9/mieter-app ab.
#   Merge auf main  -> Tags "latest" und "sha-<kurz>"
#   Git-Tag v0.1.0  -> Tags "0.1.0" und "0.1"
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/brainx9/mieter-app

jobs:
  veroeffentlichen:
    name: Bauen und veröffentlichen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Vor dem Veröffentlichen einmal lokal bauen und den Compose-Test ausführen.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mieter-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker/compose-test.sh mieter-app:test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
