# Betrieb auf der Synology (oder jedem anderen Docker-Host).
# Anleitung: docs/synology.md
#   Ordner z. B. /volume1/docker/mieter-app mit dieser Datei und einer .env
#   (Vorlage: .env.synology.beispiel). Die Datenbank liegt in ./daten/postgres.
name: mieter-app

x-app: &app
  image: ${MIETER_IMAGE:-ghcr.io/brainx9/mieter-app}:${MIETER_VERSION:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-mieter}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}@postgres:5432/${POSTGRES_DB:-mieter}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mieter}
      POSTGRES_USER: ${POSTGRES_USER:-mieter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      TZ: Europe/Berlin
    volumes:
      - ./daten/postgres:/var/lib/postgresql/data
    healthcheck:
      # Über TCP und mit echter Abfrage: Beim ersten Start meldet pg_isready über den Socket
      # schon Bereitschaft, bevor die Datenbank angelegt ist.
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -U "$${POSTGRES_USER}"
          -d "$${POSTGRES_DB}" -tAc "SELECT 1" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    command: web
    # Nur auf der Synology selbst erreichbar; von außen über den Reverse Proxy von DSM.
    ports:
      - "127.0.0.1:${MIETER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/gesund/', timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  worker:
    <<: *app
    command: worker
    depends_on:
      # web führt beim Start die Migrationen aus, die der Worker braucht.
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "manage.py", "procrastinate", "healthchecks"]
      interval: 60s
      timeout: 30s
      start_period: 30s
      retries: 3
